name: CI Pipeline (Code Quality & Security)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# AppSec: Principle of Least Privilege (PoLP)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, TypeCheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Deno 2.x
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Verify Code Formatting
        run: deno fmt --check

      - name: Run Deno Linter
        run: deno lint

      - name: Run Strict Type Check
        run: deno check main.ts dev.ts services/*.ts routes/**/*.ts routes/**/*.tsx

      - name: Execute Unit & Integration Test Suite
        run: deno test --unstable-kv -A --ignore=tests/worker.test.ts

  worker:
    name: Cloudflare Worker (TypeCheck, Tests & Dry-Run)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeCheck & Vitest
        run: npm run check

      - name: Wrangler Dry-Run Bundle
        run: npx wrangler deploy --dry-run

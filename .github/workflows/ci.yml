name: CI Pipeline (Code Quality & Security)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# AppSec: Principle of Least Privilege (PoLP)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, TypeCheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Deno 2.x
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Verify Code Formatting
        run: deno fmt --check

      - name: Run Deno Linter
        run: deno lint

      - name: Run Strict Type Check
        run: deno check **/*.ts **/*.tsx

      - name: Execute Unit & Integration Test Suite
        run: deno test --unstable-kv -A

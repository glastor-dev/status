<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40"
  height="40" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#bg-grad)"
    stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <circle cx="20" cy="20" r="11" stroke="url(#logo-grad)" stroke-width="2.5"
    stroke-dasharray="69" stroke-dashoffset="15" stroke-linecap="round" />
  <circle cx="20" cy="20" r="5" fill="#10b981" filter="url(#glow)" />
  <circle cx="20" cy="20" r="2.5" fill="#ffffff" />
</svg>
